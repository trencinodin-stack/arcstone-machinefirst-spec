name: Validate MACHINEFIRST v0.1.1 Specification & Linter

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  conformance-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify pinned artifact SHA-256 digests
        run: sha256sum -c MACHINEFIRST.sha256

      - name: Validate repository MACHINEFIRST.md (strict + mirror check)
        run: python validate_machinefirst.py MACHINEFIRST.md --strict --mirror-path machinefirst.txt

      - name: Validate neutral ML example (strict mode)
        run: python validate_machinefirst.py examples/python-ml-eval/MACHINEFIRST.md --strict

      - name: Validate starter template (structural mode)
        run: python validate_machinefirst.py MACHINEFIRST.template.md

      - name: Run conformance test suite
        run: python -m unittest discover -s tests -v
