name: Validate MACHINEFIRST v0.1.1 Specification & Linter

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  conformance-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate starter template (structural mode)
        run: python validate_machinefirst.py MACHINEFIRST.template.md

      - name: Run conformance test suite
        run: python -m unittest discover -s tests -v
